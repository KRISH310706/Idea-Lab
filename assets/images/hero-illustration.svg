<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="60%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="fieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.0" />
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="2" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="450" rx="24" fill="url(#skyGrad)" />

  <!-- Sun -->
  <circle cx="120" cy="110" r="45" fill="url(#sunGrad)" opacity="0.85" />
  <circle cx="120" cy="110" r="58" stroke="#fde047" stroke-width="2" stroke-dasharray="4 6" opacity="0.6" />

  <!-- Rolling Hills / Farmland -->
  <path d="M-20 330 Q 140 240, 310 310 T 620 280 L 620 460 L -20 460 Z" fill="#bbf7d0" opacity="0.6" />
  <path d="M-20 360 Q 180 290, 380 340 T 620 320 L 620 460 L -20 460 Z" fill="url(#fieldGrad)" opacity="0.85" />

  <!-- Contour lines on fields -->
  <path d="M 0 380 Q 200 320 440 370" stroke="#166534" stroke-width="2" fill="none" opacity="0.3" />
  <path d="M 40 410 Q 240 350 520 400" stroke="#166534" stroke-width="2" fill="none" opacity="0.3" />

  <!-- Village trees & houses in background -->
  <polygon points="90,260 120,230 150,260" fill="#dc2626" opacity="0.8" />
  <rect x="98" y="260" width="44" height="30" fill="#fef08a" />
  <rect x="114" y="272" width="12" height="18" fill="#78350f" />

  <polygon points="155,270 180,245 205,270" fill="#ea580c" opacity="0.8" />
  <rect x="162" y="270" width="36" height="24" fill="#ffedd5" />

  <!-- Green foliage trees -->
  <circle cx="75" cy="265" r="18" fill="#15803d" />
  <circle cx="65" cy="275" r="14" fill="#166534" />
  <rect x="72" y="280" width="6" height="15" fill="#78350f" />

  <circle cx="225" cy="270" r="16" fill="#15803d" />
  <rect x="222" y="282" width="6" height="14" fill="#78350f" />

  <!-- Central Element: Smartphone displaying digital entrepreneurship & growth -->
  <g transform="translate(310, 65)" filter="url(#shadow)">
    <!-- Smartphone body -->
    <rect x="0" y="0" width="220" height="340" rx="28" fill="url(#phoneGrad)" />
    <!-- Screen -->
    <rect x="10" y="14" width="200" height="312" rx="20" fill="#ffffff" />
    <!-- Speaker earphone bar -->
    <rect x="85" y="6" width="50" height="4" rx="2" fill="#64748b" />

    <!-- Screen UI Header -->
    <rect x="24" y="32" width="172" height="36" rx="8" fill="#f0fdf4" />
    <circle cx="44" cy="50" r="10" fill="#16a34a" />
    <path d="M44 54 C44 48, 50 46, 50 46 C50 46, 50 52, 44 54 Z" fill="#ffffff" />
    <rect x="62" y="44" width="70" height="6" rx="3" fill="#166534" />
    <rect x="62" y="54" width="45" height="4" rx="2" fill="#86efac" />

    <!-- Growth Graph Card -->
    <rect x="24" y="80" width="172" height="110" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="36" y="100" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">व्यापार वाढ / Growth</text>
    <text x="36" y="114" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">+42% Local Sales</text>

    <!-- Graph path -->
    <path d="M 36 165 Q 70 155, 95 140 T 150 120 T 180 102 L 180 170 L 36 170 Z" fill="url(#chartGrad)" />
    <path d="M 36 165 Q 70 155, 95 140 T 150 120 T 180 102" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" />
    <circle cx="180" cy="102" r="4" fill="#16a34a" stroke="#ffffff" stroke-width="2" />

    <!-- Feature Mini Badges on phone screen -->
    <g transform="translate(24, 204)">
      <rect x="0" y="0" width="80" height="50" rx="8" fill="#eff6ff" stroke="#bfdbfe" />
      <text x="8" y="20" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#1d4ed8">MUDRA</text>
      <text x="8" y="34" font-family="system-ui, sans-serif" font-size="8" fill="#3b82f6">योजना माहिती</text>
    </g>

    <g transform="translate(116, 204)">
      <rect x="0" y="0" width="80" height="50" rx="8" fill="#fef2f2" stroke="#fecaca" />
      <text x="8" y="20" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#b91c1c">बाजारभाव</text>
      <text x="8" y="34" font-family="system-ui, sans-serif" font-size="8" fill="#ef4444">Market Info</text>
    </g>

    <!-- Phone Action Button -->
    <rect x="24" y="268" width="172" height="32" rx="8" fill="#16a34a" />
    <text x="110" y="288" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff">शिकायला सुरुवात करा ➔</text>
  </g>

  <!-- Left Side: Rural Entrepreneur Elements & Produce Basket -->
  <g transform="translate(60, 290)" filter="url(#shadow)">
    <path d="M 20 50 Q 5 90, 30 110 L 110 110 Q 135 90, 120 50 Z" fill="#b45309" />
    <path d="M 18 50 Q 70 45, 122 50 Q 70 55, 18 50 Z" fill="#92400e" />
    <path d="M 28 65 L 112 65 M 34 82 L 106 82 M 40 98 L 100 98" stroke="#78350f" stroke-width="2" />
    <rect x="35" y="20" width="22" height="34" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    <rect x="38" y="14" width="16" height="7" rx="2" fill="#3b82f6" />
    <rect x="62" y="24" width="24" height="28" rx="4" fill="#f59e0b" stroke="#d97706" stroke-width="2" />
    <rect x="66" y="18" width="16" height="7" rx="2" fill="#ef4444" />
    <circle cx="95" cy="40" r="14" fill="#ef4444" />
    <path d="M 95 26 Q 98 22, 102 24" stroke="#15803d" stroke-width="2" fill="none" />
    <circle cx="82" cy="45" r="12" fill="#84cc16" />
    <circle cx="56" cy="46" r="10" fill="#eab308" />
  </g>

  <!-- Floating Feature Tags with Icons -->
  <g transform="translate(40, 150)" filter="url(#shadow)">
    <rect x="0" y="0" width="165" height="42" rx="21" fill="#ffffff" stroke="#bbf7d0" stroke-width="2" />
    <circle cx="21" cy="21" r="14" fill="#dcfce7" />
    <text x="21" y="26" text-anchor="middle" font-size="14">🌱</text>
    <text x="44" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#166534">स्थानिक उद्योग</text>
    <text x="44" y="32" font-family="system-ui, sans-serif" font-size="9" fill="#4b5563">Rural Entrepreneurship</text>
  </g>

  <g transform="translate(140, 80)" filter="url(#shadow)">
    <rect x="0" y="0" width="155" height="42" rx="21" fill="#ffffff" stroke="#fed7aa" stroke-width="2" />
    <circle cx="21" cy="21" r="14" fill="#ffedd5" />
    <text x="21" y="26" text-anchor="middle" font-size="14">🗣️</text>
    <text x="44" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#9a3412">३ भाषांमध्ये ज्ञान</text>
    <text x="44" y="32" font-family="system-ui, sans-serif" font-size="9" fill="#4b5563">Marathi • Hindi • English</text>
  </g>
</svg>
